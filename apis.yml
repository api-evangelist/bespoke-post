apis:
- name: Bespoke Post Storefront API
  description: 'Undocumented first-party storefront API serving the bespokepost.com
    web experience. It is not published as a developer product: there is no portal,
    no reference documentation, no specification and no authentication guide. Its
    existence and eight of its paths are asserted by Bespoke Post itself in robots.txt,
    where they carry explicit Allow directives for named AI agents. The paths cover
    product collections, the product catalog, the current user session, carts, monthly
    box assignments, personalized "for you" assignments, user segments and the
    onboarding quiz questions. Endpoints sit behind Cloudflare bot management and
    returned HTTP 403 to every probe, so no response contract was observed.'
