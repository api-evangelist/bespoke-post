aid: bespoke-post
name: Bespoke Post
description: 'Bespoke Post is a New York City direct-to-consumer men''s lifestyle retailer
  founded in 2011 by Rishi Prabhu and Steven Szaronos. It sells curated menswear, gear
  and home goods through a free-to-join membership: members answer an onboarding quiz,
  are offered a personalized monthly "Box of Awesome" shipment they can preview, swap
  or skip, and buy at member pricing. Alongside third-party independent brands the
  company operates its own labels, including Line of Trade and Fieldworth (apparel),
  Halfday (travel), Wren (outdoor), Ash and Fir (home and fragrance) and Marcellin
  (kitchen and bar). Bespoke Post publishes no public developer portal, API documentation
  or machine-readable specification. It does run an internal storefront API under
  /api/ on its own domain and - unusually for a retailer - names eight of those paths
  in robots.txt with explicit Allow directives for AI agents including GPTBot,
  ChatGPT-User, OAI-Searchbot, ClaudeBot, anthropic-ai, PerplexityBot, meta-externalagent
  and cohere-ai, while disallowing /api/ to every other agent.'
