# WHAT THIS IS
# Bespoke Post publishes no OpenAPI and no `x-agentic-access` contract. It does,
# however, publish a machine-readable, AI-agent-specific access policy in its
# robots.txt: eight named AI crawlers/agents are granted explicit `Allow:` access
# to eight named /api/ paths, while the wildcard `User-agent: *` group is
# `Disallow: /api/`. That is an affirmative, provider-authored statement about
# which agents may call which API surfaces — captured here verbatim.
#
# SCOPE + LIMITS (read before using)
#   - This is a PATH-level allowlist, not an operation-level execution contract.
#     No action-class, consequence, token-TTL, or escalation semantics are
#     published; the fields below are recorded, not inferred.
#   - robots.txt is advisory. It is not enforcement, and it grants no credential.
#   - The endpoints themselves sit behind a Cloudflare bot challenge (HTTP 403 to
#     a non-verified client), so their response contracts were NOT observed.
#     Their existence is asserted by the provider, not confirmed by us.

posture:
  published_contract: false          # no x-agentic-access / no OpenAPI
  agent_policy_published: true       # robots.txt agent directives
  policy_format: robots.txt
  granularity: path
  enforcement: advisory
  default_for_unnamed_agents: disallow   # `User-agent: *` -> Disallow: /api/

summary:
  agents_named: 8
  api_paths_allowed: 8
  paths_disallowed_to_others: 9
  authentication_documented: false
  operation_level_semantics: false

# Verbatim from the two Allow: groups in robots.txt.
allowed_agents:
  - agent: Googlebot
    class: search
  - agent: Googlebot-Image
    class: search
  - agent: Bingbot
    class: search
  - agent: GPTBot
